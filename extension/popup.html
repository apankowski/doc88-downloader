<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>doc88 Downloader</title>
  <style>
    body { width: 300px; margin: 0; padding: 14px; font: 14px/1.4 system-ui, sans-serif; color: #1f2937; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    label { display: block; margin: 8px 0 2px; font-weight: 600; font-size: 12px; }
    select, input { width: 100%; box-sizing: border-box; padding: 5px 6px; font: inherit; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    button { width: 100%; margin-top: 14px; padding: 9px; font: inherit; font-weight: 600; color: #fff;
             background: #2563eb; border: 0; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #94a3b8; cursor: default; }
    #message { margin-top: 10px; min-height: 1.4em; font-size: 12px; }
    .error { color: #b91c1c; }
    .hint { font-size: 11px; color: #6b7280; margin-top: 2px; }
  </style>
</head>
<body>
  <h1>doc88 Downloader</h1>

  <label for="format">Image format</label>
  <select id="format">
    <option value="png">PNG (lossless, large files)</option>
    <option value="jpg">JPEG (smaller files)</option>
  </select>

  <div id="qualityRow" hidden>
    <label for="quality">JPEG quality (0.1 – 1)</label>
    <input id="quality" type="number" min="0.1" max="1" step="0.05" value="0.9">
  </div>

  <label for="zoomSteps">Resolution boost (zoom steps)</label>
  <select id="zoomSteps">
    <option value="0">0 – original size</option>
    <option value="1">1 – about 1.3×</option>
    <option value="2">2 – about 1.7×</option>
    <option value="3" selected>3 – about 2× (recommended)</option>
    <option value="4">4 – about 2.4×</option>
    <option value="5">5 – about 2.7×</option>
  </select>
  <div class="hint">Some documents ignore zoom and stay at original size.</div>

  <div class="row">
    <div>
      <label for="fromPage">From page</label>
      <input id="fromPage" type="number" min="1" placeholder="1">
    </div>
    <div>
      <label for="toPage">To page</label>
      <input id="toPage" type="number" min="1" placeholder="last">
    </div>
  </div>

  <label for="archive">Output</label>
  <select id="archive">
    <option value="zip">One ZIP archive</option>
    <option value="none">Separate image files</option>
  </select>

  <button id="start">Download pages</button>
  <div id="message"></div>

  <script src="popup.js"></script>
</body>
</html>
